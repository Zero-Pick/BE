name: Java CI with Gradle

on:
  push:
    branches-ignore:
      - main
      - develop

jobs:
  build:
    name: Continuous Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup MySQL
        uses: mirromutth/mysql-action@v1.1
        with:
          mysql database: 'testDB'
          mysql user: 'test'
          mysql password: 'testPW'

      - name: Create application.properties
        run: |
          cat <<EOT > ./src/test/resources/application.properties
          spring.application.name=zeropick
          
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          spring.datasource.url=jdbc:mysql://localhost:3306/testDB?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          spring.datasource.username=test
          spring.datasource.password=testPW
          
          # spring jpa
          spring.jpa.database=mysql
          spring.jpa.properties.hibernate.show_sql=true
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.properties.hibernate.format_sql=true
          
          commit.hash=local
          api.server.url=http://localhost:8080

          cloud.aws.credentials.access-key=${{ secrets.ACCESS_KEY }}
          cloud.aws.credentials.secret-key=${{ secrets.SECRET_KEY }}
          cloud.aws.region.static=ap-northeast-2
          cloud.aws.s3.bucket=${{ secrets.S3BUCKET }}
          
          spring.servlet.multipart.enabled=true
          spring.servlet.multipart.max-file-size=10MB
          spring.servlet.multipart.max-request-size=10MB
          EOT
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v 3.1.0

      - name: Get short SHA
        id: slug
        run: echo "sha7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build
